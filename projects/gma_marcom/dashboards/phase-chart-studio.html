<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GMA Phase Chart Studio</title>
<script>
try {
  const saved = localStorage.getItem('gma-phase-chain-theme');
  document.documentElement.dataset.theme = saved === 'dark' ? 'dark' : 'light';
} catch {}
</script>
<style>
:root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
:root[data-theme="light"] {
  --background:#fff; --foreground:#1a1c1f; --muted-foreground:#667085; --border:#d7dee8;
  --popover:#fff; --viz-series-1:#1677d2; --viz-series-2:#e17b2d; --viz-series-3:#2a9d5b;
  --viz-series-4:#a653d7; --viz-series-5:#d44883; --viz-series-6:#168f88;
}
:root[data-theme="dark"] {
  color-scheme:dark; --background:#181818; --foreground:#fff; --muted-foreground:#aab2c0; --border:#394150;
  --popover:#2d2d2d; --viz-series-1:#83c3ff; --viz-series-2:#f59a56; --viz-series-3:#74d58b;
  --viz-series-4:#c59af2; --viz-series-5:#f08fc0; --viz-series-6:#5acbc2;
}
* { box-sizing:border-box; }
body { margin:0; padding:20px; background:var(--background); color:var(--foreground); }
.studio-header { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:16px; }
h1 { margin:0; font-size:28px; font-weight:620; letter-spacing:-.02em; }
.subtitle { margin:4px 0 0; color:var(--muted-foreground); font-size:13px; }
.header-actions { display:flex; gap:8px; }
.button, .header-actions a { display:inline-flex; align-items:center; justify-content:center; padding:7px 10px; border:1px solid var(--border); border-radius:5px; background:transparent; color:var(--foreground); font:inherit; font-size:12px; font-weight:600; text-decoration:none; cursor:pointer; }
.button:hover, .header-actions a:hover { background:var(--popover); }
.button.primary { background:var(--foreground); color:var(--background); border-color:var(--foreground); }
.studio-layout { display:grid; grid-template-columns:300px minmax(0,1fr); gap:22px; align-items:start; }
.controls { display:grid; gap:15px; position:sticky; top:16px; max-height:calc(100vh - 32px); overflow:auto; padding-right:5px; }
.control-group { display:grid; gap:9px; padding-bottom:14px; border-bottom:1px solid var(--border); }
.control-group h2 { margin:0; font-size:13px; font-weight:650; }
.field { display:grid; gap:4px; color:var(--muted-foreground); font-size:11px; }
.field select, .field input[type="text"] { width:100%; padding:7px 8px; border:1px solid var(--border); border-radius:4px; background:var(--background); color:var(--foreground); font:inherit; font-size:12px; }
.range-label { display:flex; justify-content:space-between; gap:8px; color:var(--foreground); font-size:11px; }
.field input[type="range"] { width:100%; accent-color:var(--viz-series-1); }
.field[hidden] { display:none; }
.preview-area { min-width:0; overflow:auto; padding:4px 18px 18px 4px; }
.preview-meta { display:flex; justify-content:space-between; gap:12px; margin:0 0 7px; color:var(--muted-foreground); font-size:11px; }
.preview-frame { position:relative; width:min(900px,100%); height:560px; min-width:440px; min-height:320px; max-width:1400px; max-height:1000px; resize:both; overflow:hidden; border:1px solid var(--border); background:var(--background); }
.resize-handle { position:absolute; z-index:3; right:2px; bottom:2px; width:24px; height:24px; padding:0; border:0; background:transparent; color:var(--muted-foreground); font:16px/1 system-ui; cursor:nwse-resize; touch-action:none; }
#studio-chart { display:block; width:100%; height:100%; }
.tooltip { position:fixed; z-index:20; display:none; pointer-events:none; padding:7px 9px; border:1px solid var(--border); background:var(--popover); color:var(--foreground); font-size:12px; line-height:1.4; box-shadow:0 4px 18px rgb(0 0 0 / .14); }
@media (max-width:820px) {
  body { padding:14px; }
  .studio-layout { grid-template-columns:1fr; }
  .controls { position:static; max-height:none; grid-template-columns:repeat(2,minmax(0,1fr)); }
  .preview-frame { min-width:360px; }
}
@media (max-width:560px) {
  .studio-header { display:block; }
  .header-actions { margin-top:10px; }
  .controls { grid-template-columns:1fr; }
  .preview-frame { width:100%; min-width:320px; height:400px; }
}
</style>
</head>
<body>
<header class="studio-header">
  <div><h1>Phase Chart Studio</h1><p class="subtitle">Select a chart, resize the canvas, tune its labels, then export the visible SVG.</p></div>
  <div class="header-actions"><a href="phase-chain-correlations.html">Back to dashboard</a><button class="button" id="theme-toggle" type="button">Dark mode</button><button class="button primary" id="export-svg" type="button">Export SVG</button></div>
</header>
<div class="studio-layout">
  <aside class="controls" aria-label="Chart studio controls">
    <section class="control-group">
      <h2>Chart</h2>
      <label class="field">Metric pair<select id="pair-select"></select></label>
      <label class="field">Chart type<select id="chart-select"><option value="scatter">Scatter</option><option value="trend">Monthly trend</option><option value="conversion">Conversion rate</option></select></label>
      <label class="field" id="media-field" hidden>Media measure<select id="media-select"></select></label>
      <label class="field">Start month<select id="start-select"></select></label>
      <label class="field">End month<select id="end-select"></select></label>
      <label class="field">Month alignment<select id="month-select"><option value="gregorian">Gregorian month</option><option value="sales">Sales month allocation</option></select></label>
      <label class="field" id="adops-field">Google AdOps scope<select id="adops-select"><option value="include">Include make_only</option><option value="exclude">Exclude make_only</option></select></label>
      <label class="field">Adstock decay<div class="range-label"><span>Upstream carry</span><output id="decay-value">0.00</output></div><input id="decay" type="range" min="0" max="0.9" step="0.05" value="0"></label>
    </section>
    <section class="control-group">
      <h2>Labels</h2>
      <label class="field">Title<input id="title-input" type="text"></label>
      <label class="field">Subtitle<input id="subtitle-input" type="text"></label>
      <label class="field">X-axis label<input id="x-label-input" type="text"></label>
      <label class="field">Y-axis label<input id="y-label-input" type="text"></label>
      <label class="field" id="right-y-label-field" hidden>Right-axis label<input id="right-y-label-input" type="text"></label>
    </section>
    <section class="control-group">
      <h2>Font sizes</h2>
      <label class="field"><span class="range-label"><span>Title</span><output id="title-size-value"></output></span><input id="title-size" type="range" min="16" max="40" value="26"></label>
      <label class="field"><span class="range-label"><span>Subtitle / statistic</span><output id="subtitle-size-value"></output></span><input id="subtitle-size" type="range" min="11" max="24" value="13"></label>
      <label class="field"><span class="range-label"><span>Axis titles</span><output id="axis-size-value"></output></span><input id="axis-size" type="range" min="11" max="24" value="13"></label>
      <label class="field"><span class="range-label"><span>Axis ticks</span><output id="tick-size-value"></output></span><input id="tick-size" type="range" min="11" max="20" value="11"></label>
      <label class="field"><span class="range-label"><span>Year / point labels</span><output id="data-size-value"></output></span><input id="data-size" type="range" min="11" max="22" value="12"></label>
      <label class="field"><span class="range-label"><span>Legend</span><output id="legend-size-value"></output></span><input id="legend-size" type="range" min="11" max="22" value="12"></label>
    </section>
    <section class="control-group">
      <h2>Plot position</h2>
      <label class="field"><span class="range-label"><span>Left margin</span><output id="left-margin-value"></output></span><input id="left-margin" type="range" min="52" max="180" value="82"></label>
      <label class="field"><span class="range-label"><span>Right margin</span><output id="right-margin-value"></output></span><input id="right-margin" type="range" min="30" max="180" value="64"></label>
      <label class="field"><span class="range-label"><span>Top margin</span><output id="top-margin-value"></output></span><input id="top-margin" type="range" min="80" max="180" value="112"></label>
      <label class="field"><span class="range-label"><span>Bottom margin</span><output id="bottom-margin-value"></output></span><input id="bottom-margin" type="range" min="62" max="160" value="94"></label>
    </section>
  </aside>
  <main class="preview-area">
    <div class="preview-meta"><span>Drag the lower-right corner to resize</span><output id="dimensions"></output></div>
    <div class="preview-frame" id="preview-frame"><svg id="studio-chart" role="img" aria-label="Editable chart preview"></svg><button type="button" class="resize-handle" id="resize-handle" aria-label="Resize chart canvas">↘</button></div>
  </main>
</div>
<div class="tooltip" id="tooltip" role="tooltip"></div>

    svg.append('text').attr('x',m.left+(width-m.left-m.right)/2).attr('y',height-18).attr('text-anchor','middle').attr('fill',color('--foreground')).attr('font-size',axisSize).text($('x-label-input').value);
    svg.append('text').attr('transform',`translate(20,${m.top+(height-m.top-m.bottom)/2}) rotate(-90)`).attr('text-anchor','middle').attr('fill',color('--foreground')).attr('font-size',axisSize).text($('y-label-input').value);
  }
  function legend(svg,items,width,height) {
    const font=+$('legend-size').value;let cursor=24;const y=height-7;
    items.forEach(item=>{svg.append('line').attr('x1',cursor).attr('x2',cursor+14).attr('y1',y-4).attr('y2',y-4).attr('stroke',item.color).attr('stroke-width',3);cursor+=20;const text=svg.append('text').attr('x',cursor).attr('y',y).attr('fill',color('--muted-foreground')).attr('font-size',font).text(item.label);cursor+=text.node().getComputedTextLength()+18;});
  }
  function draw() {
    const activePair=pair(), rows=rowsForChart(activePair), type=chartSelect.value;
    const width=Math.max(320,Math.round(frame.clientWidth)),height=Math.max(300,Math.round(frame.clientHeight));
    $('dimensions').value=`${width} × ${height}px`;
    $('decay-value').value=(+$('decay').value).toFixed(2);
    sizeIds.forEach(id=>$(id+'-size-value').value=`${$(id+'-size').value}px`);
    marginIds.forEach(id=>$(id+'-margin-value').value=`${$(id+'-margin').value}px`);
    const m={left:+$('left-margin').value,right:+$('right-margin').value,top:+$('top-margin').value,bottom:+$('bottom-margin').value};
    const svg=d3.select('#studio-chart').attr('viewBox',`0 0 ${width} ${height}`).attr('width',width).attr('height',height);svg.selectAll('*').remove();
    svg.append('title').text($('title-input').value);svg.append('desc').text(`Editable ${type} chart for ${activePair.label}`);addTitles(svg,width,rows);
    if(!rows.length){svg.append('text').attr('x',width/2).attr('y',height/2).attr('text-anchor','middle').attr('fill',color('--muted-foreground')).text('No available observations');return;}
    if(type==='scatter') {
      const x=d3.scaleLinear().domain(padded(rows.map(d=>d.x))).nice().range([m.left,width-m.right]);
      const y=d3.scaleLinear().domain(padded(rows.map(d=>d.y))).nice().range([height-m.bottom,m.top]);axes(svg,x,y,width,height,m,activePair,type);
      const mx=d3.mean(rows,d=>d.x),my=d3.mean(rows,d=>d.y),slope=d3.sum(rows,d=>(d.x-mx)*(d.y-my))/d3.sum(rows,d=>(d.x-mx)**2),intercept=my-slope*mx,[x0,x1]=d3.extent(rows,d=>d.x);
      svg.append('line').attr('x1',x(x0)).attr('x2',x(x1)).attr('y1',y(intercept+slope*x0)).attr('y2',y(intercept+slope*x1)).attr('stroke',color('--viz-series-2')).attr('stroke-width',2).attr('stroke-dasharray','7 5');
      const years=[...new Set(rows.map(d=>d.year))],colors=['--viz-series-4','--viz-series-5','--viz-series-6','--viz-series-1'];
      svg.selectAll('circle.point').data(rows).join('circle').attr('class','point').attr('cx',d=>x(d.x)).attr('cy',d=>y(d.y)).attr('r',5).attr('fill',d=>color(colors[years.indexOf(d.year)%colors.length])).attr('stroke',color('--background')).on('pointermove',(e,d)=>showTip(e,`<strong>${monthLabel(d.date)}</strong><br>${activePair.xLabel}: ${fmtValue(Math.round(d.x))}<br>${activePair.yLabel}: ${fmtValue(Math.round(d.y))}`)).on('pointerleave',hideTip);
      legend(svg,[...years.map((year,index)=>({label:String(year),color:color(colors[index%colors.length])})),{label:'Regression',color:color('--viz-series-2')}],width,height);
    } else if(type==='trend') {
      const x=d3.scaleTime().domain(d3.extent(rows,d=>d.date)).range([m.left,width-m.right]);
      const y=d3.scaleLinear().domain([0,d3.max(rows,d=>d.y)*1.08]).nice().range([height-m.bottom,m.top]);
      const yUpstream=d3.scaleLinear().domain([0,d3.max(rows,d=>d.x)*1.08]).nice().range([height-m.bottom,m.top]);axes(svg,x,y,width,height,m,activePair,type);
      svg.append('g').attr('transform',`translate(${width-m.right},0)`).call(d3.axisRight(yUpstream).ticks(6).tickFormat(d3.format('~s')));
      svg.selectAll('.tick text').attr('fill',color('--foreground')).attr('font-size',+$('tick-size').value);svg.selectAll('.domain,.tick line').attr('stroke',color('--border'));
      svg.append('text').attr('transform',`translate(${width-17},${m.top+(height-m.top-m.bottom)/2}) rotate(90)`).attr('text-anchor','middle').attr('fill',color('--foreground')).attr('font-size',+$('axis-size').value).text($('right-y-label-input').value);
      const line=d3.line().x(d=>x(d.date));svg.append('path').datum(rows).attr('fill','none').attr('stroke',color('--viz-series-3')).attr('stroke-width',2.5).attr('d',line.y(d=>yUpstream(d.x)));svg.append('path').datum(rows).attr('fill','none').attr('stroke',color('--viz-series-1')).attr('stroke-width',2.5).attr('d',line.y(d=>y(d.y)));
      d3.groups(rows,d=>d.year).forEach(([year,values])=>svg.append('text').attr('x',(x(values[0].date)+x(values.at(-1).date))/2).attr('y',m.top-10).attr('text-anchor','middle').attr('fill',color('--foreground')).attr('font-size',+$('data-size').value).text(`${year} r=${d3.format('.3f')(pearson(values))}`));
      legend(svg,[{label:activePair.yLabel,color:color('--viz-series-1')},{label:activePair.xLabel,color:color('--viz-series-3')}],width,height);
    } else {
      const x=d3.scaleTime().domain(d3.extent(rows,d=>d.date)).range([m.left,width-m.right]);
      const y=d3.scaleLinear().domain([0,d3.max(rows,d=>d.rate)*1.1]).nice().range([height-m.bottom,m.top]);axes(svg,x,y,width,height,m,activePair,type);
      const avg=d3.mean(rows,d=>d.rate);svg.append('line').attr('x1',m.left).attr('x2',width-m.right).attr('y1',y(avg)).attr('y2',y(avg)).attr('stroke',color('--viz-series-2')).attr('stroke-width',2).attr('stroke-dasharray','7 5');svg.append('text').attr('x',width-m.right-5).attr('y',y(avg)-7).attr('text-anchor','end').attr('fill',color('--viz-series-2')).attr('font-size',+$('data-size').value).text(`Average ${d3.format('.2%')(avg)}`);
      svg.append('path').datum(rows).attr('fill','none').attr('stroke',color('--viz-series-1')).attr('stroke-width',2.5).attr('d',d3.line().x(d=>x(d.date)).y(d=>y(d.rate)));svg.selectAll('circle.rate').data(rows).join('circle').attr('cx',d=>x(d.date)).attr('cy',d=>y(d.rate)).attr('r',4).attr('fill',color('--viz-series-1')).on('pointermove',(e,d)=>showTip(e,`<strong>${monthLabel(d.date)}</strong><br>Conversion: ${d3.format('.2%')(d.rate)}`)).on('pointerleave',hideTip);legend(svg,[{label:`${activePair.yLabel} ÷ raw ${activePair.xLabel}`,color:color('--viz-series-1')},{label:'Period average',color:color('--viz-series-2')}],width,height);
    }
  }
  function updatePair() {
    const activePair=pair();mediaField.hidden=!activePair.measures;adopsField.hidden=!(activePair.xKey==='adops_index'||activePair.yKey==='adops_index');refreshDates(true);defaultLabels();draw();
  }
  pairSelect.addEventListener('change',updatePair);mediaSelect.addEventListener('change',updatePair);chartSelect.addEventListener('change',()=>{defaultLabels();draw();});
  startSelect.addEventListener('change',()=>{if(startSelect.value>endSelect.value)endSelect.value=startSelect.value;defaultLabels();draw();});endSelect.addEventListener('change',()=>{if(endSelect.value<startSelect.value)startSelect.value=endSelect.value;defaultLabels();draw();});monthSelect.addEventListener('change',()=>{refreshDates(false);defaultLabels();draw();});adopsSelect.addEventListener('change',()=>{refreshDates(false);draw();});
  document.querySelectorAll('input[type="range"],input[type="text"]').forEach(input=>input.addEventListener('input',draw));
  $('theme-toggle').addEventListener('click',()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;$('theme-toggle').textContent=next==='dark'?'Light mode':'Dark mode';try{localStorage.setItem('gma-phase-chain-theme',next);}catch{}draw();});
  function exportSvg() {
    const svg=$('studio-chart').cloneNode(true);svg.setAttribute('xmlns','http://www.w3.org/2000/svg');svg.setAttribute('font-family','Inter, Arial, sans-serif');const source=new XMLSerializer().serializeToString(svg);const url=URL.createObjectURL(new Blob([source],{type:'image/svg+xml;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=`${pair().key}-${chartSelect.value}.svg`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
  $('export-svg').addEventListener('click',exportSvg);
  let resizeStart=null;
  $('resize-handle').addEventListener('pointerdown',event=>{
    resizeStart={x:event.clientX,y:event.clientY,width:frame.offsetWidth,height:frame.offsetHeight};
    event.currentTarget.setPointerCapture(event.pointerId);
    event.preventDefault();
  });
  $('resize-handle').addEventListener('pointermove',event=>{
    if(!resizeStart)return;
    frame.style.width=`${Math.max(320,Math.min(1400,resizeStart.width+event.clientX-resizeStart.x))}px`;
    frame.style.height=`${Math.max(300,Math.min(1000,resizeStart.height+event.clientY-resizeStart.y))}px`;
  });
  $('resize-handle').addEventListener('pointerup',()=>{resizeStart=null;});
  $('resize-handle').addEventListener('pointercancel',()=>{resizeStart=null;});
  $('resize-handle').addEventListener('keydown',event=>{
    if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key))return;
    const step=event.shiftKey?50:10;
    if(event.key==='ArrowLeft'||event.key==='ArrowRight') frame.style.width=`${Math.max(320,Math.min(1400,frame.offsetWidth+(event.key==='ArrowRight'?step:-step)))}px`;
    else frame.style.height=`${Math.max(300,Math.min(1000,frame.offsetHeight+(event.key==='ArrowDown'?step:-step)))}px`;
    event.preventDefault();
  });
  new ResizeObserver(draw).observe(frame);
  pairSelect.value='media_adops';mediaSelect.value='media_t1t2_spend';$('theme-toggle').textContent=document.documentElement.dataset.theme==='dark'?'Light mode':'Dark mode';updatePair();
})();
</script>
